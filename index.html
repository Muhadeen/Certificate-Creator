<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AspireQuiz: past-question quizzes for campus aspirants</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#10122b;--paper:#f6f5ff;--blue:#2d3cff;--sun:#ffd43b;--mint:#12a77f;--red:#e5484d;--line:#d9d9ef;--mut:#5b5e80}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 "DM Sans",system-ui,sans-serif;color:var(--ink);background:var(--paper)}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;line-height:1.05;letter-spacing:-.025em;margin:0 0 .5em}
h1{font-size:clamp(2.4rem,6vw,4.2rem)}h2{font-size:clamp(1.6rem,3.5vw,2.4rem)}h3{font-size:1.2rem}a{color:var(--blue)}
.w{max-width:1080px;margin:0 auto;padding:0 20px 40px}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:2px solid var(--ink)}
header .w{display:flex;align-items:center;gap:14px;height:62px;padding-bottom:0}
.logo{font:800 1.3rem "Bricolage Grotesque",sans-serif;color:var(--ink);text-decoration:none;margin-right:auto}
.logo i{background:var(--sun);border:2px solid var(--ink);border-radius:6px;padding:0 6px;font-style:normal;display:inline-block;transform:rotate(-4deg);margin-right:6px}
nav a{margin-left:14px;text-decoration:none;color:var(--ink);font-weight:700}nav a.b{color:var(--ink)}
.b{display:inline-block;border:2px solid var(--ink);background:var(--blue);color:#fff;font:700 1rem "DM Sans",sans-serif;padding:10px 18px;border-radius:10px;cursor:pointer;text-decoration:none;box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.b:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}.b.y{background:var(--sun);color:var(--ink)}.b.o{background:#fff;color:var(--ink)}.b.r{background:var(--red)}.b.s{padding:5px 11px;font-size:.88rem;box-shadow:2px 2px 0 var(--ink)}
.card{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:20px;margin-bottom:16px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--ink);border-radius:10px;background:#fff;margin:4px 0 12px}label{font-weight:700;font-size:.92rem}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.hero{display:grid;gap:40px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:center;padding:56px 0}
.mut{color:var(--mut)}.pill{background:var(--sun);border:2px solid var(--ink);border-radius:99px;padding:2px 12px;font-weight:700;font-size:.9rem;display:inline-block;margin-bottom:14px}
.ballot{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:22px;box-shadow:8px 8px 0 var(--ink);transform:rotate(2deg)}
.opt{display:flex;gap:10px;align-items:center;padding:9px 12px;border:2px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer;font-weight:500}.opt input{width:auto;margin:0}
.opt.ok{border-color:var(--mint);background:#e6f8f2}.opt.no{border-color:var(--red);background:#fdeceb}
.pick{animation:pick .3s 1.2s forwards}@keyframes pick{to{border-color:var(--mint);background:#e6f8f2}}
.price{font:800 2.4rem "Bricolage Grotesque",sans-serif}
.bar{height:14px;background:var(--line);border-radius:7px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--blue)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid var(--line);font-size:.93rem}
#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,90px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;transition:.25s;z-index:9}#toast.on{transform:translate(-50%,0)}
.timer{position:sticky;top:64px;z-index:4;background:var(--sun);border:2px solid var(--ink);border-radius:10px;padding:8px 14px;font-weight:800;display:flex;justify-content:space-between;margin-bottom:14px}
.flyer{width:100%;max-height:260px;object-fit:cover;border-radius:12px;border:2px solid var(--ink);margin-bottom:12px}
pre{white-space:pre-wrap;background:var(--ink);color:#e9e9ff;padding:12px;border-radius:10px;font-size:.85rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><div class="w"><a class="logo" href="#/"><i>✓</i>AspireQuiz</a><nav></nav></div></header>
<main id="app"><div class="w"><p>Loading…</p></div></main><div id="toast"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,addDoc,collection,query,where,getDocs}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== 1. PASTE YOUR FIREBASE CONFIG AND ADMIN EMAIL HERE ===== */
const CFG={apiKey:"YOUR_API_KEY",authDomain:"YOUR_PROJECT.firebaseapp.com",projectId:"YOUR_PROJECT",appId:"YOUR_APP_ID"};
const ADMIN_EMAIL="you@example.com";
/* Default prices/contact (you change these live from the Admin page) */
const DEF={cur:"GH₵",plans:[{n:"Starter",p:30,d:7},{n:"Monthly",p:80,d:30},{n:"Campaign",p:200,d:90}],phone:"024 000 0000",note:"Pay by Mobile Money to 024 000 0000 (Your Name), then upload your screenshot and transaction ID below.",free:2,max:50};

const au=getAuth(initializeApp(CFG)),db=getFirestore(),app=document.getElementById("app");
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const D=t=>new Date(t).toLocaleDateString(),slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""),link=s=>location.href.split("#")[0]+"#/q/"+s;
const go=h=>location.hash="#/"+h,adm=()=>U&&U.email===ADMIN_EMAIL,paid=()=>P&&P.until>Date.now();
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2800)};
const img=(f,w)=>new Promise(r=>{const i=new Image;i.onload=()=>{const k=Math.min(1,w/i.width),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.72))};i.src=URL.createObjectURL(f)});
const col=(n,k,v)=>getDocs(k?query(collection(db,n),where(k,"==",v)):collection(db,n)).then(s=>s.docs.map(d=>({id:d.id,ref:d.ref,...d.data()})));
let U=null,P=null,S=DEF,T,busy=false;
const AIP=`Convert the exam questions I give you into plain text using exactly this format. Keep the original wording. Add no explanations. Leave a blank line between questions.

Q: Question text here
A) First option
B) Second option
C) Third option
D) Fourth option
Answer: B

If the correct answer is unknown, leave out the Answer line.`;

onAuthStateChanged(au,async u=>{if(busy)return;U=u;P=null;
 try{const s=await getDoc(doc(db,"settings","app"));if(s.exists())S={...DEF,...s.data()}}catch(e){}
 if(u){const s=await getDoc(doc(db,"users",u.uid));if(s.exists())P={id:u.uid,...s.data()}}
 if(u&&location.hash.startsWith("#/auth"))return go("dash");route()});
addEventListener("hashchange",route);

function nav(){$("nav").innerHTML=U?`<a href="#/dash">Dashboard</a>${adm()?'<a href="#/admin">Admin</a>':""}<a href="#/" onclick="A.out()">Log out</a>`:`<a href="#/auth/login">Log in</a><a class="b s y" href="#/auth/signup">Start free</a>`}
async function route(){clearInterval(T);nav();window.scrollTo(0,0);const[p,a]=(location.hash.slice(2)||"").split("/");
 try{await({auth:authPg,dash,new:newq,results,q:take,admin,pay}[p]||home)(a)}catch(e){app.innerHTML=`<div class="w"><div class="card">Something went wrong: ${esc(e.message)}</div></div>`}}

const plans=()=>S.plans.map(p=>`<div class="card"><h3>${esc(p.n)}</h3><div class="price">${esc(S.cur)}${p.p}</div><p class="mut">${p.d} days. Unlimited quizzes, up to 200 questions each.</p></div>`).join("");
const home=()=>{app.innerHTML=`<div class="w"><section class="hero"><div><span class="pill">Your first ${S.free} quizzes are free</span><h1>Past questions, turned into a quiz everybody shares.</h1><p class="mut" style="font-size:1.15rem;max-width:36ch">Upload a past-question PDF, set the timer and send students one link. They see your flyer, take the quiz, review every answer and remember who helped them.</p><a class="b" href="#/auth/signup">Create your first quiz</a> <button class="b o" onclick="document.getElementById('pr').scrollIntoView({behavior:'smooth'})">See pricing</button></div>
<div class="ballot"><p style="margin:0 0 12px"><b>Kofi for SLC President</b> <span class="pill" style="float:right;margin:0">⏱ 12:00</span></p><h3>Which organelle makes most of the cell's ATP?</h3><div class="opt">A. Nucleus</div><div class="opt">B. Ribosome</div><div class="opt pick">C. Mitochondrion</div><div class="opt">D. Golgi body</div></div></section>
<h2>From PDF to shared link in four steps</h2><div class="g"><div class="card"><h3>1. Sign up</h3><p>Add your name, contact and campaign flyer.</p></div><div class="card"><h3>2. Add questions</h3><p>Upload a PDF, or paste text from any AI tool for scanned papers.</p></div><div class="card"><h3>3. Publish</h3><p>Pick correct answers, set the minutes, share your link.</p></div><div class="card"><h3>4. Watch results</h3><p>See scores, trends and which questions students miss.</p></div></div>
<h2 id="pr" style="margin-top:48px">Pricing</h2><div class="g">${plans()}</div><p class="mut">Questions? Call or WhatsApp ${esc(S.phone)}.</p></div>`};

function authPg(m){const s=m==="signup";app.innerHTML=`<div class="w" style="max-width:440px;padding-top:40px"><div class="card"><h2>${s?"Create your account":"Welcome back"}</h2><form onsubmit="A.${s?"signup":"login"}(event)">${s?`<label>Full name (shown on your quizzes)</label><input name="name" required><label>Phone number (shown to students)</label><input name="phone" required>`:""}<label>Email</label><input name="email" type="email" required><label>Password</label><input name="pw" type="password" minlength="6" required><button class="b y">${s?"Sign up":"Log in"}</button></form><p>${s?`Have an account? <a href="#/auth/login">Log in</a>`:`New here? <a href="#/auth/signup">Sign up free</a>`}</p></div></div>`}

async function dash(){if(!U)return go("auth/login");if(!P){app.innerHTML=`<div class="w"><div class="card">We couldn't find your account. Call ${esc(S.phone)}.</div></div>`;return}
 const qs=(await col("quizzes","owner",U.uid)).sort((a,b)=>b.at-a.at);
 app.innerHTML=`<div class="w" style="padding-top:24px"><div class="g"><div class="card">${P.flyer?`<img class="flyer" src="${P.flyer}" alt="Your flyer">`:`<p class="mut">No flyer yet. Students see it above every quiz you share.</p>`}<label>Campaign flyer</label><input type="file" accept="image/*" onchange="A.flyer(this)"><b>${esc(P.name)}</b><br><span class="mut">${esc(P.phone)}</span></div>
 <div class="card"><h3>${paid()?"Plan active":"Free trial"}</h3><p>${paid()?`Active until ${D(P.until)}.`:`${qs.length} of ${S.free} free quizzes used, up to ${S.max} questions each.`}</p><a class="b y" href="#/pay">${paid()?"Extend plan":"Choose a plan"}</a></div></div>
 <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px"><h2>Your quizzes</h2><a class="b" href="#/new">New quiz</a></div>
 ${qs.length?qs.map(q=>`<div class="card"><h3>${esc(q.title)}</h3><p class="mut">${q.qs.length} questions, ${q.min} min, ${q.live?"live":"hidden"}</p><button class="b s" onclick="A.cl('${q.slug}')">Copy link</button> <a class="b s o" href="#/results/${q.id}">Results</a> <button class="b s o" onclick="A.lv('${q.id}',${!q.live})">${q.live?"Hide":"Publish"}</button> <button class="b s r" onclick="A.dq('${q.id}')">Delete</button></div>`).join(""):`<div class="card">No quizzes yet. Create one from a past-question PDF.</div>`}</div>`}

async function newq(){if(!U||!P)return go("auth/login");
 const n=(await col("quizzes","owner",U.uid)).length;if(!paid()&&n>=S.free){toast("Free trial finished. Choose a plan to continue.");return go("pay")}
 A.d=[];app.innerHTML=`<div class="w" style="padding-top:24px;max-width:760px"><h2>New quiz</h2><div class="card"><label>Course title</label><input id="ti" placeholder="e.g. BIO 101 mid-sem 2023"><label>Time limit (minutes)</label><input id="mi" type="number" value="30" min="1"><label>Upload a text-based PDF</label><input type="file" accept=".pdf" onchange="A.pdf(this)"><label>Or paste questions in this format</label><textarea id="tx" rows="8" placeholder="Q: Question text&#10;A) Option&#10;B) Option&#10;Answer: B"></textarea><button class="b" onclick="A.build()">Build questions</button></div>
 <div class="card"><h3>Scanned PDF? Let an AI tool format it</h3><p class="mut">Copy this prompt, paste it with your scanned questions into any AI tool, then paste the result above.</p><pre id="ai">${esc(AIP)}</pre><button class="b o s" onclick="A.cp()">Copy prompt</button></div><div id="ed"></div></div>`}

const parse=t=>{const qs=[];let c=null,m;for(let l of t.split(/\r?\n/)){l=l.trim();if(!l)continue;
 if(m=l.match(/^(?:Q\s*\d*|\d+)\s*[:.)]\s*(.+)/i)){c={q:m[1],o:[],a:-1};qs.push(c)}
 else if(c&&(m=l.match(/^\(?([A-Ea-e])[.)]\s*(.+)/)))c.o.push(m[2]);
 else if(c&&(m=l.match(/^Answer\s*[:\-]\s*\(?([A-Ea-e])/i)))c.a="abcde".indexOf(m[1].toLowerCase());
 else if(c&&!c.o.length)c.q+=" "+l}
 return qs.filter(q=>q.o.length>1).slice(0,paid()?200:S.max)};
const rev=(qs,a)=>qs.map((q,i)=>`<div class="card"><b>${i+1}. ${esc(q.q)}</b>${q.o.map((o,j)=>`<div class="opt ${j===q.a?"ok":a[i]===j?"no":""}">${"ABCDE"[j]}. ${esc(o)}${j===a[i]?" (your answer)":""}${j===q.a?" (correct)":""}</div>`).join("")}</div>`).join("");

async function take(s){const d=(await col("quizzes","slug",s))[0];if(!d||!d.live){app.innerHTML=`<div class="w"><div class="card">This quiz isn't available. Check the link with whoever shared it.</div></div>`;return}
 A.z=d;app.innerHTML=`<div class="w" style="max-width:720px;padding-top:24px">${d.flyer?`<img class="flyer" src="${d.flyer}" alt="">`:""}<div class="card"><h2>${esc(d.title)}</h2><p>Shared by <b>${esc(d.name)}</b>${d.phone?`, <a href="tel:${esc(d.phone)}">${esc(d.phone)}</a>`:""}</p><p class="mut">${d.qs.length} questions in ${d.min} minutes. The timer starts when you press start.</p><label>Your name</label><input id="nm"><button class="b y" onclick="A.start()">Start quiz</button></div></div>`}

async function results(id){if(!U)return go("auth/login");const z=await getDoc(doc(db,"quizzes",id));if(!z.exists()||(z.data().owner!==U.uid&&!adm()))return go("dash");const q=z.data();
 const rs=(await col("responses","quizId",id)).sort((a,b)=>b.at-a.at);A.rs=rs;A.q=q;const n=rs.length,pc=r=>Math.round(100*r.sc/r.tot),bk=[0,0,0,0,0];rs.forEach(r=>bk[Math.min(4,Math.floor(pc(r)/20))]++);
 const bar=(l,v,m)=>`<div>${l}</div><div class="bar"><i style="width:${m?100*v/m:0}%"></i></div>`;
 app.innerHTML=`<div class="w" style="padding-top:24px"><h2>${esc(q.title)}</h2><p><b>${n}</b> attempts, average <b>${n?Math.round(rs.reduce((s,r)=>s+pc(r),0)/n):0}%</b>, best <b>${n?Math.max(...rs.map(pc)):0}%</b></p>
 <div class="g"><div class="card"><h3>Score spread</h3>${["0-19%","20-39%","40-59%","60-79%","80-100%"].map((l,i)=>bar(`${l}: ${bk[i]} students`,bk[i],Math.max(...bk))).join("")}</div><div class="card"><h3>Correct answers per question</h3>${q.qs.map((x,i)=>{const v=n?Math.round(100*rs.filter(r=>r.a[i]===x.a).length/n):0;return bar(`Q${i+1}: ${v}%`,v,100)}).join("")}</div></div>
 <div class="card" style="overflow-x:auto"><table><tr><th>Name</th><th>Score</th><th>%</th><th>Date</th><th></th></tr>${rs.map((r,i)=>`<tr><td>${esc(r.name)}</td><td>${r.sc}/${r.tot}</td><td>${pc(r)}%</td><td>${D(r.at)}</td><td><button class="b s o" onclick="A.view(${i})">Review</button></td></tr>`).join("")||"<tr><td>No responses yet. Share your link.</td></tr>"}</table></div><div id="rv"></div></div>`}

async function pay(){if(!U||!P)return go("auth/login");const my=(await col("payments","uid",U.uid)).sort((a,b)=>b.at-a.at);
 app.innerHTML=`<div class="w" style="padding-top:24px;max-width:760px"><h2>Choose a plan</h2><div class="g">${plans()}</div><div class="card"><h3>How to pay</h3><p>${esc(S.note)}</p><p>In a hurry? Call <b>${esc(S.phone)}</b> and we'll confirm quickly.</p><form onsubmit="A.paySub(event)"><label>Plan</label><select name="pl">${S.plans.map((p,i)=>`<option value="${i}">${esc(p.n)}: ${esc(S.cur)}${p.p}</option>`).join("")}</select><label>Transaction ID</label><input name="tx" required><label>Payment screenshot</label><input name="sh" type="file" accept="image/*" required><button class="b y">Submit payment</button></form></div>${my.length?`<div class="card"><h3>Your payments</h3>${my.map(p=>`<p>${D(p.at)}: ${esc(p.plan)}, <b>${p.status}</b></p>`).join("")}</div>`:""}</div>`}

async function admin(){if(!adm())return go("");const t=A.tab||"pay";
 let h=`<div class="w" style="padding-top:24px"><h2>Admin</h2><div class="tabs">${[["pay","Payments"],["set","Prices & contact"],["usr","Users"],["qz","Quizzes"]].map(([k,n])=>`<button class="b s ${t===k?"y":"o"}" onclick="A.tb('${k}')">${n}</button>`).join("")}</div>`;
 if(t==="pay"){const ps=await col("payments");A.ps={};ps.forEach(p=>A.ps[p.id]=p);ps.sort((a,b)=>(a.status==="pending"?0:1)-(b.status==="pending"?0:1)||b.at-a.at);
  h+=ps.map(p=>`<div class="card"><b>${esc(p.name)}</b> (${esc(p.email)})<br>${esc(p.plan)}, ${esc(S.cur)}${p.price}, ID ${esc(p.txn)}, ${D(p.at)}, <b>${p.status}</b><br><img src="${p.shot}" alt="Payment screenshot" style="max-width:220px;border-radius:8px;cursor:zoom-in;margin:8px 0" onclick="this.style.maxWidth=this.style.maxWidth==='100%'?'220px':'100%'"><br>${p.status==="pending"?`<button class="b s" onclick="A.pa('${p.id}',1)">Approve</button> <button class="b r s" onclick="A.pa('${p.id}',0)">Reject</button>`:""}</div>`).join("")||`<div class="card">No payments yet.</div>`}
 if(t==="set"){const pl=[0,1,2,3].map(i=>S.plans[i]||{n:"",p:0,d:30});
  h+=`<form class="card" onsubmit="A.sv(event)"><h3>Plans (leave a name blank to remove it)</h3>${pl.map((p,i)=>`<div class="g"><div><label>Name</label><input name="n${i}" value="${esc(p.n)}"></div><div><label>Price</label><input name="p${i}" type="number" step="any" value="${p.p}"></div><div><label>Days</label><input name="d${i}" type="number" value="${p.d}"></div></div>`).join("")}<label>Currency symbol</label><input name="cur" value="${esc(S.cur)}"><label>Your contact number</label><input name="ph" value="${esc(S.phone)}"><label>Payment instructions</label><textarea name="nt" rows="3">${esc(S.note)}</textarea><div class="g"><div><label>Free quizzes per user</label><input name="fr" type="number" value="${S.free}"></div><div><label>Max questions per free quiz</label><input name="mx" type="number" value="${S.max}"></div></div><button class="b y">Save changes</button></form>`}
 if(t==="usr"){const us=await col("users");h+=`<div class="card" style="overflow-x:auto"><table><tr><th>Name</th><th>Email</th><th>Phone</th><th>Plan</th><th></th></tr>${us.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.phone)}</td><td>${u.until>Date.now()?"Until "+D(u.until):"Free"}</td><td><button class="b s r" onclick="A.du('${u.id}')">Delete</button></td></tr>`).join("")}</table></div>`}
 if(t==="qz"){const qs=(await col("quizzes")).sort((a,b)=>b.at-a.at);h+=qs.map(q=>`<div class="card"><b>${esc(q.title)}</b> by ${esc(q.name)}<br><span class="mut">${q.qs.length} questions, ${q.live?"live":"hidden"}</span><br><button class="b s" onclick="A.cl('${q.slug}')">Copy link</button> <a class="b s o" href="#/results/${q.id}">Results</a> <button class="b s o" onclick="A.lv('${q.id}',${!q.live})">${q.live?"Hide":"Show"}</button> <button class="b s r" onclick="A.dq('${q.id}')">Delete</button></div>`).join("")||`<div class="card">No quizzes yet.</div>`}
 app.innerHTML=h+"</div>"}

const A=window.A={d:[],a:[],
 out(){signOut(au)},tb(k){A.tab=k;route()},cp(){navigator.clipboard.writeText(AIP);toast("Prompt copied")},cl(s){navigator.clipboard.writeText(link(s));toast("Link copied")},
 async signup(e){e.preventDefault();const f=new FormData(e.target);busy=true;try{const c=await createUserWithEmailAndPassword(au,f.get("email"),f.get("pw"));U=c.user;const p={name:f.get("name"),phone:f.get("phone"),email:f.get("email"),flyer:"",until:0,at:Date.now()};await setDoc(doc(db,"users",U.uid),p);P={id:U.uid,...p};busy=false;go("dash");route()}catch(x){busy=false;toast(x.message)}},
 async login(e){e.preventDefault();const f=new FormData(e.target);try{await signInWithEmailAndPassword(au,f.get("email"),f.get("pw"))}catch(x){toast("Wrong email or password")}},
 async flyer(el){const f=el.files[0];if(!f)return;const d=await img(f,600);await updateDoc(doc(db,"users",U.uid),{flyer:d});P.flyer=d;for(const q of await col("quizzes","owner",U.uid))await updateDoc(q.ref,{flyer:d});toast("Flyer updated");route()},
 async pdf(el){const f=el.files[0];if(!f)return;toast("Reading PDF…");try{
  if(!window.pdfjsLib){await new Promise((r,j)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";s.onload=r;s.onerror=j;document.head.appendChild(s)});pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"}
  const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let out="";
  for(let i=1;i<=d.numPages;i++){const c=await(await d.getPage(i)).getTextContent();let y=null,l="";for(const t of c.items){const ty=Math.round(t.transform[5]);if(y!==null&&Math.abs(ty-y)>3){out+=l.trim()+"\n";l=""}y=ty;l+=t.str+" "}out+=l.trim()+"\n"}
  $("#tx").value=out;out.trim().length<40?toast("No text found. This looks scanned, so use the AI prompt below."):A.build()}catch(x){toast("Couldn't read that PDF. Try the AI prompt below.")}},
 build(){A.d=parse($("#tx").value);A.ed();if(!A.d.length)toast("No questions found. Check the format.")},
 ed(){$("#ed").innerHTML=A.d.length?`<div class="card"><h3>${A.d.length} questions. Tick the correct answer for each.</h3>`+A.d.map((q,i)=>`<div style="margin:18px 0"><input value="${esc(q.q)}" onchange="A.d[${i}].q=this.value">${q.o.map((o,j)=>`<label class="opt"><input type="radio" name="r${i}" ${q.a===j?"checked":""} onchange="A.d[${i}].a=${j}">${"ABCDE"[j]}. ${esc(o)}</label>`).join("")}<button class="b r s" onclick="A.d.splice(${i},1);A.ed()">Remove</button></div>`).join("")+`<button class="b y" onclick="A.pub()">Publish quiz</button></div>`:""},
 async pub(){const t=$("#ti").value.trim(),m=+$("#mi").value;if(!t||!(m>0))return toast("Add a course title and time limit");if(!A.d.length)return;if(A.d.some(q=>q.a<0))return toast("Pick a correct answer for every question");
  const s=slug((P.name.split(" ")[0]||"quiz")+"-"+t)+"-"+Math.random().toString(36).slice(2,5);
  await addDoc(collection(db,"quizzes"),{owner:U.uid,name:P.name,phone:P.phone,flyer:P.flyer||"",title:t,min:m,slug:s,qs:A.d,live:true,at:Date.now()});toast("Published");go("dash")},
 start(){const n=$("#nm").value.trim();if(!n)return toast("Enter your name");A.n=n;A.a=[];let t=A.z.min*60;
  app.innerHTML=`<div class="w" style="max-width:720px"><div class="timer"><span>${esc(A.z.title)}</span><span id="tm"></span></div>`+A.z.qs.map((q,i)=>`<div class="card"><b>${i+1}. ${esc(q.q)}</b>${q.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" onchange="A.a[${i}]=${j}">${esc(o)}</label>`).join("")}</div>`).join("")+`<button class="b y" onclick="A.sub()">Submit answers</button></div>`;
  const f=()=>{$("#tm").textContent=Math.floor(t/60)+":"+String(t%60).padStart(2,"0");if(t--<=0)A.sub()};f();T=setInterval(f,1e3)},
 async sub(){clearInterval(T);const z=A.z,a=z.qs.map((_,i)=>A.a[i]??-1),sc=z.qs.filter((q,i)=>a[i]===q.a).length;
  try{await addDoc(collection(db,"responses"),{quizId:z.id,name:A.n,a,sc,tot:z.qs.length,at:Date.now()})}catch(e){}
  app.innerHTML=`<div class="w" style="max-width:720px;padding-top:24px"><div class="card"><h2>${esc(A.n)}, you scored ${sc}/${z.qs.length}</h2><p>Review your answers below. Correct answers are in green. Thanks for taking this quiz from <b>${esc(z.name)}</b>.</p></div>${rev(z.qs,a)}</div>`;window.scrollTo(0,0)},
 view(i){const r=A.rs[i];$("#rv").innerHTML=`<h3>${esc(r.name)}: ${r.sc}/${r.tot}</h3>`+rev(A.q.qs,r.a);$("#rv").scrollIntoView({behavior:"smooth"})},
 async paySub(e){e.preventDefault();const f=new FormData(e.target),p=S.plans[+f.get("pl")];if(!f.get("sh").size)return toast("Add your payment screenshot");
  await addDoc(collection(db,"payments"),{uid:U.uid,email:U.email,name:P.name,plan:p.n,price:p.p,days:p.d,txn:f.get("tx"),shot:await img(f.get("sh"),900),status:"pending",at:Date.now()});toast("Sent. We'll confirm shortly.");route()},
 async pa(id,ok){const p=A.ps[id];await updateDoc(doc(db,"payments",id),{status:ok?"approved":"rejected"});if(ok){const u=await getDoc(doc(db,"users",p.uid));await updateDoc(doc(db,"users",p.uid),{until:Math.max(Date.now(),u.data().until||0)+p.days*864e5})}toast("Done");route()},
 async sv(e){e.preventDefault();const f=new FormData(e.target);S={...S,plans:[0,1,2,3].map(i=>({n:f.get("n"+i).trim(),p:+f.get("p"+i),d:+f.get("d"+i)})).filter(p=>p.n&&p.d>0),cur:f.get("cur"),phone:f.get("ph"),note:f.get("nt"),free:+f.get("fr"),max:+f.get("mx")};await setDoc(doc(db,"settings","app"),S);toast("Saved. The home page and plans now show your prices.")},
 async du(id){if(!confirm("Delete this user and all their quizzes?"))return;for(const q of await col("quizzes","owner",id))await deleteDoc(q.ref);await deleteDoc(doc(db,"users",id));toast("User deleted");route()},
 async lv(id,b){await updateDoc(doc(db,"quizzes",id),{live:b});route()},
 async dq(id){if(!confirm("Delete this quiz?"))return;await deleteDoc(doc(db,"quizzes",id));route()}};
</script></body></html>
